{% load static %}
<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}TrainerHub{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header class="topbar">
        <a class="brand" href="{% url 'home' %}">TrainerHub</a>
        <nav class="nav">
            {% if user.is_authenticated %}
                <a href="{% url 'home' %}">Domů</a>
                {% if user.is_trainer %}
                    <a href="{% url 'clients' %}">Klienti</a>
                    <a href="{% url 'exercise_list' %}">Cviky</a>
                {% endif %}
                <form method="post" action="{% url 'logout' %}" class="inline-form">
                    {% csrf_token %}
                    <button type="submit" class="link-button">
                        Odhlásit ({{ user.username }})
                    </button>
                </form>
            {% else %}
                <a href="{% url 'login' %}">Přihlásit</a>
                <a href="{% url 'register' %}">Registrace</a>
            {% endif %}
        </nav>
    </header>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    {% block scripts %}{% endblock %}
</body>
</html>
