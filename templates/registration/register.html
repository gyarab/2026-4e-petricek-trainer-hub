{% extends "base.html" %}
{% block title %}Registrace{% endblock %}
{% block content %}
<h1>Registrace</h1>
<form method="post" class="card">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="button">Vytvořit účet</button>
</form>
<p>Už máte účet? <a href="{% url 'login' %}">Přihlaste se</a></p>
{% endblock %}
